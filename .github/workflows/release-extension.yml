name: Release Extension

on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  build:
    name: Package extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Verify vendored grammar checksums before packaging
      - name: Verify vendored WASM checksums
        run: |
          cd vendor
          while IFS='  ' read -r expected file; do
            actual=$(sha256sum "grammars/$file" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "CHECKSUM MISMATCH: $file (expected $expected, got $actual)"
              exit 1
            fi
          done < checksums.txt
          echo "All checksums verified ✓"

      # Copy vendored WASMs + queries into extension directory for packaging
      - name: Stage extension assets
        run: |
          cp -r vendor/grammars/ apps/extension/vendor/
          cp -r queries/ apps/extension/queries/

      # Zip the extension directory (Chrome Web Store format)
      - name: Create extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#ext-v}"
          cd apps/extension
          zip -r "../../astra-extension-${VERSION}.zip" . \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX/*"
          echo "EXTENSION_VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Generate SBOM for the extension package
      - name: Generate SBOM
        run: |
          # Produce a minimal SPDX-JSON SBOM without external tools.
          # The extension has zero runtime JS dependencies — only our own
          # vanilla JS + vendored WASM grammar files.
          cat > "astra-extension-${EXTENSION_VERSION}.spdx.json" << SBOM
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "astra-extension-${EXTENSION_VERSION}",
            "documentNamespace": "https://github.com/astra-pr/astra/releases/tag/ext-v${EXTENSION_VERSION}",
            "documentDescribes": ["SPDXRef-Package"],
            "packages": [
              {
                "SPDXID": "SPDXRef-Package",
                "name": "astra-extension",
                "versionInfo": "${EXTENSION_VERSION}",
                "downloadLocation": "https://github.com/astra-pr/astra/releases/tag/ext-v${EXTENSION_VERSION}",
                "filesAnalyzed": false,
                "licenseConcluded": "MIT",
                "licenseDeclared": "MIT",
                "supplier": "Organization: astra-pr",
                "comment": "Zero runtime JS deps. WASM grammar files vendored from official tree-sitter releases."
              }
            ]
          }
          SBOM

      # Create checksums for release artifacts
      - name: Create release checksums
        run: |
          sha256sum "astra-extension-${EXTENSION_VERSION}.zip" \
            "astra-extension-${EXTENSION_VERSION}.spdx.json" \
            > "astra-extension-${EXTENSION_VERSION}.sha256sums"

      # Publish to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Astra Extension v${{ env.EXTENSION_VERSION }}"
          body: |
            ## Astra Chrome Extension v${{ env.EXTENSION_VERSION }}

            ### Trust posture
            - Zero runtime JS dependencies
            - No backend, no OAuth, no telemetry
            - WASM grammar files vendored from official tree-sitter releases (SHA256-verified)
            - Uses your existing GitHub session (no token stored)

            ### Install options
            1. **Chrome Web Store** (pending review): link when approved
            2. **Unpacked install** (no store trust required):
               - Download `astra-extension-${{ env.EXTENSION_VERSION }}.zip`
               - Extract it
               - Open `chrome://extensions`, enable Developer Mode
               - Click "Load unpacked" and select the extracted directory

            ### Verification
            ```bash
            sha256sum -c astra-extension-${{ env.EXTENSION_VERSION }}.sha256sums
            ```

            ### SBOM
            See `astra-extension-${{ env.EXTENSION_VERSION }}.spdx.json` for the Software Bill of Materials.
          files: |
            astra-extension-${{ env.EXTENSION_VERSION }}.zip
            astra-extension-${{ env.EXTENSION_VERSION }}.spdx.json
            astra-extension-${{ env.EXTENSION_VERSION }}.sha256sums
