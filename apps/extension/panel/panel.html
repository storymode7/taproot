<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Astra</title>
  <link rel="stylesheet" href="../lib/shared/review.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="panel-header">
    <span class="astra-logo">⭐ Astra</span>
    <div class="panel-controls">
      <select id="preset-select" title="Review order preset">
        <option value="top-down">Top-down</option>
        <option value="bottom-up">Bottom-up</option>
      </select>
      <button id="btn-close" title="Close panel">✕</button>
    </div>
  </header>
  <p class="keys-hint"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>y</kbd> accept · <kbd>x</kbd> reject · <kbd>r</kbd> reviewed · <kbd>c</kbd> comment · <kbd>z</kbd> fold</p>

  <div id="panel-status">Waiting for PR diff&hellip;</div>
  <div id="snippet-list"></div>

  <!-- All JS local, no CDN, no npm at runtime -->
  <script type="module" src="panel.js"></script>
</body>
</html>
